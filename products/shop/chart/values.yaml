# Produkt "shop": erreichbar unter http://<hostname>/<pathPrefix des Dienstes>/...
# Hosts-Datei (Windows): 192.168.250.200  shop.k8s-lab
hostname: shop.k8s-lab

# Gateway aus platform/gateway/gateway.yaml
gateway:
  name: lab
  namespace: gateway

# Pod-Netz des Clusters (kubeadm podSubnet): Proxys darin (Envoy des Gateways, später nginx)
# gelten für die Dienste als vertrauenswürdig - nur dann werten sie X-Forwarded-* aus.
trustedProxyNetworks:
  - 10.244.0.0/16

# Dienste des Produkts. Für jeden Eintrag entstehen Deployment, Service und eine Regel in der
# HTTPRoute. Das Gateway entfernt pathPrefix vor der Weiterleitung (/api/catalog/x -> /x) und
# meldet ihn dem Dienst per X-Forwarded-Prefix (für Links wie den Location-Header).
services:
  catalogservice:
    image: ghcr.io/s-c-s-sl/catalogservice
    tag: "0.1.0-alpha.2"          # GitVersion-Version aus dem CI des Dienstes (Image aus Repo S-C-S-Sl/CatalogService)
    # Das Deployment legt dafür ein ReplicaSet mit dieser Anzahl Pods an.
    # Alle Pods nutzen dieselbe MongoDB (siehe "mongodb"), die Daten sind also für alle gleich.
    replicas: 3
    # Verbindung zur MongoDB: Secret im Namespace des Produkts, angelegt vom Chart platform/mongodb
    # (clients). Wird als Umgebungsvariable MongoDb__ConnectionString gesetzt (Pflicht im Dienst).
    mongodb:
      secretName: mongodb-catalog-api
      secretKey: connection-string
    port: 8080                    # Kestrel im ASP.NET-Image
    pathPrefix: /api/catalog
    # Health-Endpunkte des Dienstes (nur im Cluster erreichbar, nicht über das Gateway):
    #   liveness  - lebt der Prozess? Scheitert sie, startet Kubernetes den Container neu
    #   readiness - kann er Anfragen bedienen? Scheitert sie, bekommt der Pod keinen Verkehr
    # Ohne "probes" prüft Kubernetes nur, ob der Port offen ist.
    probes:
      liveness: /health/live
      readiness: /health/ready
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
