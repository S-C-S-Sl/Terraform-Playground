# Eine Route für das Produkt: je Dienst eine Regel nach Pfad. Der Präfix wird vor der
# Weiterleitung entfernt, der Dienst sieht seine eigenen Pfade (/api/catalog/x -> /x).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    {{- range $name, $svc := .Values.services }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ $svc.pathPrefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ $name }}
          port: 80
    {{- end }}
