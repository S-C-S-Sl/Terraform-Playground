# Basis-Konfiguration aller Lab-VMs: Pakete, Updates und die
# Betriebssystem-Voraussetzungen für Kubernetes (kubeadm).
#
# Aufruf (WSL, im Repo-Root):  ansible-playbook ansible/prepare.yml
- name: Basis-Konfiguration
  hosts: k8s   # Kubernetes-Knoten (control_plane + workers), nicht der NFS-Server
  become: true
  roles:
    - common
