
# --- Pakete -------------------------------------------------------------------
- name: Paketquellen aktualisieren und System aktualisieren
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Grundpakete installieren
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Prüfen, ob ein Neustart nötig ist
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required

- name: Neustart nach Updates
  ansible.builtin.reboot:
    msg: "Neustart durch Ansible (Updates)"
  when:
    - common_reboot_if_required
    - common_reboot_required.stat.exists

# --- Swap: kubelet startet standardmäßig nicht mit aktivem Swap ---------------
- name: Swap ausschalten
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Swap-Einträge in /etc/fstab auskommentieren
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

# --- Kernel-Module ------------------------------------------------------------
- name: Kernel-Module beim Boot laden
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      # Verwaltet durch Ansible (roles/common)
      {% for module in common_kernel_modules %}
      {{ module }}
      {% endfor %}
    mode: "0644"

- name: Kernel-Module sofort laden
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ common_kernel_modules }}"

# --- sysctl -------------------------------------------------------------------
- name: Netzwerk-Einstellungen für Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"
