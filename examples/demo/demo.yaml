# Beispielanwendung hinter dem Gateway: http://demo.k8s-lab
#
#   kubectl apply -f examples/demo/demo.yaml
#   kubectl delete -f examples/demo/demo.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
---
# Normaler ClusterIP-Service: nur im Cluster erreichbar, das Gateway leitet hierher
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: demo
spec:
  selector:
    app: demo
  ports:
    - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: demo
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - demo.k8s-lab
  rules:
    - backendRefs:
        - name: demo
          port: 80
