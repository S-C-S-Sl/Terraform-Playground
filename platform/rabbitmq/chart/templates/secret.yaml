{{- $name := include "rabbitmq.fullname" . -}}
{{- $old := include "rabbitmq.oldSecretData" . | fromJson -}}
{{- $password := .Values.auth.password | default (get $old "password" | b64dec) | default (randAlphaNum 24) -}}
# Verwaltungs-Secret im Namespace von RabbitMQ: Administrator und Passwörter der Dienste
# (einzige Quelle, aus der die Client-Secrets in den Produkt-Namespaces erzeugt werden)
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ $password | quote }}
  {{- range .Values.clients }}
  {{ printf "client-%s-password" .name }}: {{ include "rabbitmq.clientPassword" (dict "old" $old "client" .) | quote }}
  {{- end }}
