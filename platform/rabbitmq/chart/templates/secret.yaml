{{- $name := include "rabbitmq.fullname" . -}}
{{- /* Passwort: aus values, sonst aus dem bestehenden Secret, sonst neu erzeugen */ -}}
{{- $password := .Values.auth.password -}}
{{- if not $password -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
  {{- if $existing -}}
    {{- $password = index $existing.data "password" | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 24 -}}
  {{- end -}}
{{- end -}}
# Zugangsdaten für Broker und Anwendungen (gleicher Namespace)
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ $password | quote }}
  host: {{ $name | quote }}
