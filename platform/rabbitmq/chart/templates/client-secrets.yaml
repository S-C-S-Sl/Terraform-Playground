{{- /* Je Dienst ein Secret in dessen Namespace - nur dort kann der Dienst es lesen */ -}}
{{- $old := include "rabbitmq.oldSecretData" . | fromJson -}}
{{- range .Values.clients }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" (include "rabbitmq.fullname" $) .name }}
  namespace: {{ .namespace }}
  labels:
    {{- include "rabbitmq.labels" $ | nindent 4 }}
    app.kubernetes.io/component: client-credentials
type: Opaque
stringData:
  host: {{ include "rabbitmq.host" $ | quote }}
  port: "5672"
  vhost: {{ .vhost | quote }}
  username: {{ .name | quote }}
  password: {{ include "rabbitmq.clientPassword" (dict "old" $old "client" .) | quote }}
{{- end }}
