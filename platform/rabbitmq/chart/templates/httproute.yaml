{{- /* Nur anlegen, wenn die Gateway-API-CRDs installiert sind (Envoy Gateway, README Schritt 17) */ -}}
{{- if and .Values.management.httpRoute.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") }}
# Management-UI über das Gateway (nur im Lab veröffentlichen)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rabbitmq.fullname" . }}-management
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.management.httpRoute.gateway.name }}
      namespace: {{ .Values.management.httpRoute.gateway.namespace }}
  hostnames:
    - {{ .Values.management.httpRoute.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "rabbitmq.fullname" . }}
          port: 15672
{{- end }}
