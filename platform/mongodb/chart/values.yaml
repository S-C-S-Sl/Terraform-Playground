# Docker Official Image (enthält mongod und mongosh)
image:
  repository: mongo
  tag: "8.3"

# Replica Set mit einem Mitglied: verhält sich für Anwendungen wie ein produktives
# Replica Set (Transaktionen, Change Streams) und lässt sich später erweitern.
replicaSetName: rs0

auth:
  # Administrator, nur für Verwaltung und den Init-Job
  rootUsername: root
  rootPassword: ""          # leer = zufällig erzeugen und bei Updates beibehalten

# Zugriffe der Anwendungen: ein Benutzer pro Dienst mit readWrite auf genau seiner Datenbank.
# Das Chart legt dafür im Namespace des Dienstes ein Secret "mongodb-<name>" an
# (username, password, database, connection-string). Den Namespace legt install.sh an, falls er fehlt.
# Entfernte Einträge löschen weder Benutzer noch Secret automatisch.
clients:
  - name: catalog-api
    namespace: shop
    database: catalog
  - name: orders-api
    namespace: shop
    database: orders

persistence:
  size: 5Gi
  # Dynamische Bereitstellung über die StorageClass "standard" (im Lab: NFS, platform/nfs-csi).
  # In einer anderen Umgebung zeigt "standard" auf den dortigen Speicher; das Chart bleibt gleich.
  storageClass: standard

# WiredTiger-Cache passend zum Speicherlimit (Standard wäre ~50 % des Knoten-RAMs)
wiredTigerCacheSizeGB: 0.25

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
