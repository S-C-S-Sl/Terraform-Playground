apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mongodb.headless" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "mongodb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mongodb.labels" . | nindent 8 }}
    spec:
      # Benutzer "mongodb" aus dem Image
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        # mongod verlangt ein Keyfile, das nur für den Besitzer lesbar ist (0400).
        # Secret-Volumes gehören root; deshalb als uid 999 in ein emptyDir kopieren.
        - name: keyfile
          image: {{ include "mongodb.image" . }}
          command: ["bash", "-c", "cp /secret/keyfile /keyfile/keyfile && chmod 400 /keyfile/keyfile"]
          volumeMounts:
            - name: secret
              mountPath: /secret
              readOnly: true
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongodb
          image: {{ include "mongodb.image" . }}
          # Das Image startet mongod, wenn das erste Argument mit "-" beginnt.
          # Beim allerersten Start legt der Entrypoint den Root-Benutzer an (ohne replSet/keyFile),
          # danach läuft mongod mit diesen Argumenten.
          args:
            - --replSet
            - {{ .Values.replicaSetName | quote }}
            - --bind_ip_all
            - --keyFile
            - /etc/mongo-keyfile/keyfile
            - --wiredTigerCacheSizeGB
            - {{ .Values.wiredTigerCacheSizeGB | quote }}
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}
                  key: root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}
                  key: root-password
          # ping geht auch ohne Anmeldung
          startupProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongo-keyfile
              readOnly: true
      volumes:
        - name: secret
          secret:
            secretName: {{ include "mongodb.fullname" . }}
            items:
              - key: keyfile
                path: keyfile
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
