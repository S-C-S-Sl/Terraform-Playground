{{- /* Je Dienst ein Secret in dessen Namespace - nur dort kann der Dienst es lesen */ -}}
{{- $name := include "mongodb.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $old := dict -}}
{{- if $existing }}{{ $old = $existing.data }}{{ end -}}
{{- range .Values.clients }}
{{- $password := include "mongodb.clientPassword" (dict "old" $old "client" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" $name .name }}
  namespace: {{ .namespace }}
  labels:
    {{- include "mongodb.labels" $ | nindent 4 }}
    app.kubernetes.io/component: client-credentials
type: Opaque
stringData:
  username: {{ .name | quote }}
  password: {{ $password | quote }}
  database: {{ .database | quote }}
  # z. B. als ConnectionStrings__MongoDb; authSource=admin: Benutzer liegen in der admin-Datenbank
  connection-string: {{ printf "mongodb://%s:%s@%s/%s?replicaSet=%s&authSource=admin" .name $password (include "mongodb.memberHost" $) .database $.Values.replicaSetName | quote }}
{{- end }}
