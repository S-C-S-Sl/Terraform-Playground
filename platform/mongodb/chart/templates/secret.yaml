{{- $name := include "mongodb.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $old := dict -}}
{{- if $existing }}{{ $old = $existing.data }}{{ end -}}
{{- /* Werte: aus values, sonst aus dem bestehenden Secret, sonst neu erzeugen */ -}}
{{- $rootPassword := .Values.auth.rootPassword | default (get $old "root-password" | b64dec) | default (randAlphaNum 24) -}}
{{- $appPassword := .Values.auth.appPassword | default (get $old "app-password" | b64dec) | default (randAlphaNum 24) -}}
{{- $keyfile := get $old "keyfile" | b64dec | default (randAlphaNum 756) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-username: {{ .Values.auth.rootUsername | quote }}
  root-password: {{ $rootPassword | quote }}
  app-username: {{ .Values.auth.appUsername | quote }}
  app-password: {{ $appPassword | quote }}
  # Gemeinsames Geheimnis der Replica-Set-Mitglieder (auch bei nur einem Mitglied Pflicht mit Auth)
  keyfile: {{ $keyfile | quote }}
  # Für Anwendungen im Cluster, z. B. als ConnectionStrings__MongoDb
  connection-string: {{ printf "mongodb://%s:%s@%s/?replicaSet=%s&authSource=admin" .Values.auth.appUsername $appPassword (include "mongodb.memberHost" .) .Values.replicaSetName | quote }}
